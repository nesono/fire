# Default FIRE configuration — matches the built-in document types.
# Consumers can supply their own fire_config.yaml to add custom types.
fire_config_version: 1

field_definitions:
  sil:
    display_name: "SIL"
    type: enum
    values:
      - "ASIL-A"
      - "ASIL-B"
      - "ASIL-C"
      - "ASIL-D"
      - "SIL-1"
      - "SIL-2"
      - "SIL-3"
      - "SIL-4"
      - "DAL-A"
      - "DAL-B"
      - "DAL-C"
      - "DAL-D"
      - "DAL-E"
      - "PL-a"
      - "PL-b"
      - "PL-c"
      - "PL-d"
      - "QM"
    allow_todo: true
    description: "Safety Integrity Level (ISO 26262, IEC 61508, DO-178C/DO-254, ISO 13849, QM)"

  sec:
    display_name: "Sec"
    type: bool
    allow_todo: true
    description: "Security relevance flag"

  version:
    display_name: "Version"
    type: int
    min_value: 1
    allow_todo: false
    description: "Requirement version, positive integer >= 1"

  parent:
    display_name: "Parent"
    type: parent_link
    allow_todo: true
    allow_multiple: true
    description: "Markdown link(s) to parent requirement(s)"

document_types:
  sysreq:
    suffix: ".sysreq.md"
    display_name: "System Requirement"
    description: "High-level system requirements"
    required_fields:
      - sil
      - sec
      - version
    optional_fields:
      - parent

  swreq:
    suffix: ".swreq.md"
    display_name: "Software Requirement"
    description: "Implementation-level software requirements"
    required_fields:
      - sil
      - sec
      - version
    optional_fields:
      - parent

  regreq:
    suffix: ".regreq.md"
    display_name: "Regulatory Requirement"
    description: "Regulatory obligations (SIL/Sec optional)"
    required_fields:
      - version
    optional_fields:
      - sil
      - sec
      - parent
