name: Release

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to use (e.g., v0.4.0)"
        required: true
        type: string

jobs:
  upload-format-spec:
    name: Upload Format Specification
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get release version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Update FORMAT_SPECIFICATION.md version
        run: |
          sed -i "s/^**Version:** main$/**Version:** ${{ steps.get_version.outputs.version }}/" FORMAT_SPECIFICATION.md

      - name: Upload FORMAT_SPECIFICATION.md to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ steps.get_version.outputs.version }} \
            FORMAT_SPECIFICATION.md \
            --clobber
