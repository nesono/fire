name: Publish to BCR

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: bazel-contrib/publish-to-bcr@v0.2.0
        with:
          # GitHub token for creating the PR to BCR
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          # Local registry path (defaults to bazel-central-registry fork)
          local-registry: bazel-central-registry
