parameters:
  maximum_vehicle_velocity:
    type: float
    value: 55.0
    unit: m/s
    description: Maximum design velocity for the vehicle

  wheel_count:
    type: integer
    value: 4
    description: Number of wheels on the vehicle

  vehicle_name:
    type: string
    value: TestVehicle
    description: Vehicle identifier for testing

  debug_mode:
    type: boolean
    value: false
    description: Enable debug output

  braking_distance_table:
    type: table
    description: Braking distances under various conditions
    columns:
      - name: velocity
        type: float
        unit: m/s
      - name: friction_coefficient
        type: float
        unit: dimensionless
      - name: braking_distance
        type: float
        unit: m
    rows:
      - [10.0, 0.7, 7.1]
      - [20.0, 0.7, 28.6]
      - [30.0, 0.7, 64.3]
      - [10.0, 0.3, 16.7]
      - [20.0, 0.3, 66.7]
      - [30.0, 0.3, 150.0]
