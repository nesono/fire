parameters:
  maximum_vehicle_velocity:
    type: f64
    value: 55.0
    unit: m/s
    description: Maximum design velocity for the vehicle
    version: 1

  wheel_count:
    type: i32
    value: 4
    description: Number of wheels on the vehicle
    version: 1

  vehicle_name:
    type: string
    value: TestVehicle
    description: Vehicle identifier for testing
    version: 1

  debug_mode:
    type: bool
    value: false
    description: Enable debug output
    version: 1

  braking_distance_table:
    type: table
    description: Braking distances under various conditions
    version: 1
    columns:
      - name: velocity
        type: f64
        unit: m/s
      - name: friction_coefficient
        type: f64
        unit: dimensionless
      - name: braking_distance
        type: f64
        unit: m
    rows:
      - [10.0, 0.7, 7.1]
      - [20.0, 0.7, 28.6]
      - [30.0, 0.7, 64.3]
      - [10.0, 0.3, 16.7]
      - [20.0, 0.3, 66.7]
      - [30.0, 0.3, 150.0]
