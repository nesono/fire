# Pre-commit hooks for Fire project
# See https://pre-commit.com for more information

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: check-yaml
        args: ["--unsafe"] # Allow custom YAML tags in requirement frontmatter
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
  - repo: https://github.com/keith/pre-commit-buildifier
    rev: 6.4.0
    hooks:
      - id: buildifier
        args: ["--warnings=all"]
      - id: buildifier-lint
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.39.0
    hooks:
      - id: markdownlint
        args: ["--fix"]
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: "v4.0.0-alpha.8"
    hooks:
      - id: prettier
  - repo: https://github.com/psf/black
    rev: 25.9.0
    hooks:
      - id: black
  - repo: https://github.com/codespell-project/codespell
    rev: "v2.4.1"
    hooks:
      - id: codespell
        args: [-w]
        exclude: "MODULE.bazel.lock"
  - repo: https://github.com/Yelp/detect-secrets
    rev: "v1.5.0"
    hooks:
      - id: detect-secrets
        exclude: .pre-commit-config.yaml
  - repo: https://github.com/zricethezav/gitleaks
    rev: "v8.28.0"
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.13.3"
    hooks:
      - id: ruff
  - repo: local
    hooks:
      - id: require-pytest-main
        name: require pytest.main() in fire test files
        description:
          Bazel runs each *_test.py as __main__; without a pytest.main() call no
          assertions execute and the test silently passes.
        entry: |
          bash -c 'rc=0; for f in "$@"; do
            grep -q "pytest.main(" "$f" ||
              { echo "Missing pytest.main() call: $f"; rc=1; }
          done; exit $rc' --
        language: system
        files: '^fire/.*_test\.py$'
